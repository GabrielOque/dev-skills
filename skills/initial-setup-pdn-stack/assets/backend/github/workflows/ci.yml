name: CI

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: local
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only
      DB_NAME: ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check --fail-level WARNING
      - name: Every model change has its migration
        run: python manage.py makemigrations --check --dry-run
      - name: Permission catalogue is valid
        run: python manage.py migrate --noinput && python manage.py sync_permissions --dry-run
      - name: Tests
        run: python manage.py test
