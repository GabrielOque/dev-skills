<!doctype html>
{% comment %}
  Wrapper for every transactional email. Deliberately plain: branding is a
  product decision, made later. Keep inline styles only (email clients ignore
  <style> blocks inconsistently).
{% endcomment %}
<html lang="{{HTML_LANG}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;line-height:1.5;color:#1f2933;">
    <div style="max-width:560px;margin:0 auto;">
      <p style="margin:0 0 24px;font-weight:bold;">{{ project_name }}</p>
      {{ content|safe }}
      <p style="margin:32px 0 0;font-size:12px;color:#6b7280;">
        Este es un mensaje automático, por favor no lo respondas.
      </p>
    </div>
  </body>
</html>
