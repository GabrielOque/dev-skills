name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills follow the spec and the repository conventions
        run: python scripts/validate_skills.py
      - name: Marketplace and catalog are generated from the frontmatter
        run: python scripts/sync_catalog.py --check
      - name: Unit tests (repository tools and skill templates)
        run: python -m unittest discover -s tests -v
